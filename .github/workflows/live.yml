name: Live

# The live integration tests (tests/live.rs) against crates.io, the MCP
# Registry, the GitHub users API, DNS and HTTPS. Weekly, so a change on
# their side shows up here before a user hits it; also by hand.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --test live -- --include-ignored
