name: Release binaries

# Runs when a GitHub release is published, or by hand for an existing release
# (workflow_dispatch with its tag, e.g. when a runner image was retired and some
# targets are missing). Never on push or pull request. It builds one binary per
# target and attaches it, with a SHA-256 file, to that release. Asset names match
# [package.metadata.binstall] in Cargo.toml. An asset already attached is never replaced.
# Each archive it attaches, and the binary inside, gets a signed build provenance
# attestation: `gh attestation verify <file> --repo Wolfe-Jam/rust-mcp-preflight`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for, e.g. v0.1.3"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # gh release upload
      id-token: write # sign the attestation (Sigstore, through GitHub's OIDC token)
      attestations: write # store the attestation on this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # macos-14 was retired (2026-11-06: "not supported"); macos-15 is Apple silicon,
          # and the Intel binary is cross-compiled on it.
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      # Pinned by SHA: this job holds a write token.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false # the build never needs the token in .git/config

      # cargo binstall builds the URL from the crate version, so the tag must be v<version>.
      - name: Tag matches Cargo.toml
        run: |
          # tr strips the CR a Windows checkout adds; without it the version is empty.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG doesn't match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11-04
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name="rust-mcp-preflight-$TAG-$TARGET"
          mkdir -p dist
          cp README.md LICENSE dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/rust-mcp-preflight.exe" dist/
            asset="$name.zip"
            (cd dist && 7z a "../$asset" rust-mcp-preflight.exe README.md LICENSE)
          else
            cp "target/$TARGET/release/rust-mcp-preflight" dist/
            asset="$name.tar.gz"
            tar -czf "$asset" -C dist rust-mcp-preflight README.md LICENSE
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      # The token is only in these steps' environment, never in cargo build (build.rs, proc macros).
      # Never replace an asset someone may already have downloaded. A rebuild isn't
      # byte-identical, so an asset already attached also gets no new attestation.
      - name: Already attached?
        id: attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "$ASSET is already attached to $TAG: left as it is"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned by SHA: this job holds a write token.
      - name: Attest build provenance
        if: steps.attached.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.ASSET }}
            dist/rust-mcp-preflight*

      - name: Upload to the release
        if: steps.attached.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY"
