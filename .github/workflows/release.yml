name: Release binaries

# Runs only when a GitHub release is published. Never on push or pull request.
# It builds one binary per target and attaches it, with a SHA-256 file, to that
# release. Asset names match [package.metadata.binstall] in Cargo.toml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # gh release upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    env:
      TAG: ${{ github.event.release.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      # cargo binstall builds the URL from the crate version, so the tag must be v<version>.
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG doesn't match Cargo.toml version $version (expected v$version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name="rust-mcp-preflight-$TAG-$TARGET"
          mkdir -p dist
          cp README.md LICENSE dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/rust-mcp-preflight.exe" dist/
            asset="$name.zip"
            (cd dist && 7z a "../$asset" rust-mcp-preflight.exe README.md LICENSE)
          else
            cp "target/$TARGET/release/rust-mcp-preflight" dist/
            asset="$name.tar.gz"
            tar -czf "$asset" -C dist rust-mcp-preflight README.md LICENSE
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload to the release
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
