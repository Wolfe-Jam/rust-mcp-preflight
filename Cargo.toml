[package]
name = "rust-mcp-preflight"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["wolfejam"]
description = "Check an MCP Registry listing before you publish: the README mcp-name line on crates.io, server.json cargo rules, and the server name."
license = "MIT"
repository = "https://github.com/Wolfe-Jam/rust-mcp-preflight"
homepage = "https://wolfejam.dev/blog/rust-registry-guide"
documentation = "https://github.com/Wolfe-Jam/rust-mcp-preflight#readme"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "server.json", "project.faf"]
keywords = ["mcp", "mcp-registry", "crates-io", "rmcp", "preflight"]
categories = ["development-tools", "command-line-utilities"]

# `cargo binstall rust-mcp-preflight` downloads the asset the release workflow
# (.github/workflows/release.yml) attaches, instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "io-util", "io-std", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
url = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
